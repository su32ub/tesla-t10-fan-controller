[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-fan-controller"
version = "2.0.0"
description = "Tesla T10 GPU temperature driven IPMI fan controller with a native desktop UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The GPU Fan Controller Authors" }]
keywords = ["gpu", "fan-control", "ipmi", "nvidia", "tesla", "asrock", "epycd8", "tkinter"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Hardware",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
# 网络 IPMI（Windows 10/11 推荐；Linux 本地 /dev/ipmi* 模式不需要）
network = ["pyghmi>=1.6"]
build = ["pyinstaller==6.18.0"]

[project.scripts]
gpu-fan-controller = "gpu_fan_controller.__main__:main"

[project.gui-scripts]
gpu-fan-controller-desktop = "gpu_fan_controller.desktop.__main__:main"

[tool.setuptools.packages.find]
include = ["gpu_fan_controller*"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
gpu_fan_controller = ["assets/*", "static/*"]
